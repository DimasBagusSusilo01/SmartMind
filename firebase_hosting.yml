name: Deploy to Firebase Hosting on Push

on:
  push:
    branches:
      - main  # Ganti dengan 'master' jika branch utamamu bernama master

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build  # Sesuaikan jika script build kamu berbeda

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '' # Dikosongkan karena menggunakan token
          channelId: live
          projectId: smartmindjaya # ID Proyek Firebase kamu
        env:
          FIREBASE_CLI_PREVIEW: true
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
